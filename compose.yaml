services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: website
      POSTGRES_PASSWORD: website
      POSTGRES_DB: website
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U website -d website"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
