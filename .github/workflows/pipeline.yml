name: Deploy Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: deploy-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Run unit tests
        run: pnpm run test

  migrate:
    name: Migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy database migrations
        run: pnpm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks, migrate]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build production Worker
        if: github.event_name == 'push'
        run: pnpm run build

      - name: Build preview Worker
        if: github.event_name == 'pull_request'
        run: pnpm run build:preview

      - name: Deploy to production
        if: github.event_name == 'push'
        run: pnpm dlx wrangler deploy

      - name: Deploy to preview
        id: deploy
        if: github.event_name == 'pull_request'
        run: |
          pnpm dlx wrangler versions upload \
            --preview-alias "pr-${{ github.event.number }}" \
            --message "Preview for PR #${{ github.event.number }}"

          echo "url=https://pr-${{ github.event.number }}-website-preview.kevinperedo.workers.dev" >> $GITHUB_OUTPUT

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: "**Preview:** ${{ steps.deploy.outputs.url }}"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    if: github.event_name == 'pull_request'
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
